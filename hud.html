<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  .hud {
    display: flex; align-items: center; justify-content: center;
    background: #0d0f10ee; border: 1px solid #2a2f33; border-radius: 22px;
    width: 120px; height: 44px; box-sizing: border-box; margin: 0 auto;
    /* box-shadow: 0 4px 20px rgba(0,0,0,0.5); */
  }
  .bars { display: flex; align-items: center; gap: 2.5px; height: 24px; }
  .bar { width: 3px; background: #5eead4; border-radius: 2px; animation: bounce 1s ease-in-out infinite; }
  .bar:nth-child(1)  { height: 4px;  animation-delay: 0.00s; }
  .bar:nth-child(2)  { height: 9px;  animation-delay: 0.05s; }
  .bar:nth-child(3)  { height: 15px; animation-delay: 0.10s; }
  .bar:nth-child(4)  { height: 20px; animation-delay: 0.15s; }
  .bar:nth-child(5)  { height: 24px; animation-delay: 0.20s; }
  .bar:nth-child(6)  { height: 20px; animation-delay: 0.25s; }
  .bar:nth-child(7)  { height: 14px; animation-delay: 0.30s; }
  .bar:nth-child(8)  { height: 20px; animation-delay: 0.25s; }
  .bar:nth-child(9)  { height: 24px; animation-delay: 0.20s; }
  .bar:nth-child(10) { height: 20px; animation-delay: 0.15s; }
  .bar:nth-child(11) { height: 15px; animation-delay: 0.10s; }
  .bar:nth-child(12) { height: 9px;  animation-delay: 0.05s; }
  .bar:nth-child(13) { height: 4px;  animation-delay: 0.00s; }
  @keyframes bounce { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
  .hud.transcribing .bar { background: #fbbf6b; animation-duration: 0.6s; }
</style>
</head>
<body>
  <div class="hud" id="hud">
    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>
  <script type="module">
    import { listen } from "@tauri-apps/api/event";
    const hud = document.querySelector("#hud");
    listen("pipeline-status", (event) => {
      hud.classList.toggle("transcribing", event.payload.includes("transcribing"));
    });
  </script>
</body>
</html>
