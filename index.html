<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LocalVox</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>LocalVox</h1>
      <div class="status-row">
        <span id="status-dot" class="status-dot idle"></span>
        <span id="status-text">starting…</span>
      </div>
    </header>

    <section class="panel">
      <h2>Hardware</h2>
      <dl id="hardware-info" class="specs"></dl>
    </section>

    <section class="panel">
      <h2>Model</h2>
      <div id="model-list"></div>
      <p id="model-progress" class="progress"></p>
    </section>

    <footer>
      <p>Hold <kbd>Ctrl</kbd> + <kbd>F9</kbd> anywhere to dictate.</p>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
