<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LocalVox</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>LocalVox</h1>
      <div class="status-row">
        <span id="status-dot" class="status-dot idle"></span>
        <span id="status-text">starting…</span>
      </div>
    </header>

    <div id="warning-banner" class="warning-banner hidden">
      <span id="warning-text"></span>
      <button id="dismiss-warning" aria-label="Dismiss">✕</button>
    </div>

    <section class="panel">
      <h2>Hardware</h2>
      <dl id="hardware-info" class="specs"></dl>
    </section>

    <section class="panel">
      <h2>Model</h2>
      <div id="model-list"></div>
      <p id="model-progress" class="progress"></p>
    </section>

    <section class="panel">
      <h2>Hotkey</h2>
      <div class="hotkey-row">
        <label><input type="checkbox" id="mod-ctrl" /> Ctrl</label>
        <label><input type="checkbox" id="mod-alt" /> Alt</label>
        <label><input type="checkbox" id="mod-shift" /> Shift</label>
        <select id="trigger-key">
          <option>F1</option><option>F2</option><option>F3</option><option>F4</option>
          <option>F5</option><option>F6</option><option>F7</option><option>F8</option>
          <option>F9</option><option>F10</option><option>F11</option><option>F12</option>
          <option>ScrollLock</option><option>Pause</option><option>Insert</option>
        </select>
        <button id="save-hotkey">Save</button>
      </div>
      <p id="hotkey-status" class="progress"></p>
    </section>

    <section class="panel">
      <h2>Vocabulary</h2>
      <p class="hint">One word or phrase per line — names, acronyms, or jargon the model tends to mishear.</p>
      <textarea id="vocab-input" rows="4" placeholder="Localvox&#10;whisper.cpp&#10;Tauri"></textarea>
      <div class="panel-actions">
        <button id="save-vocab">Save vocabulary</button>
      </div>
    </section>

    <section class="panel">
      <h2>Corrections</h2>
      <p class="hint">Exact find-and-replace fixes, applied after transcription.</p>
      <div id="replacement-rows"></div>
      <div class="panel-actions">
        <button id="add-rule" type="button">+ Add rule</button>
        <button id="save-rules">Save corrections</button>
      </div>
    </section>

  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
