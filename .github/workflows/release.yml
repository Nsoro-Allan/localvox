name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'macos-latest'
          - platform: 'windows-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxi-dev libxtst-dev cmake clang libclang-dev \
            libasound2-dev pkg-config libopenblas-dev rpm

      - name: Configure whisper-rs build environment (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          STDBOOL_DIR=$(dirname $(find /usr/lib/gcc -name stdbool.h | head -1))
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$STDBOOL_DIR" >> "$GITHUB_ENV"
          echo "BLAS_INCLUDE_DIRS=/usr/include/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install npm dependencies
        run: npm install

      - name: Set macOS C++ deployment target
        if: matrix.platform == 'macos-latest'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-mmacosx-version-min=10.15" >> "$GITHUB_ENV"
          echo "CFLAGS=-mmacosx-version-min=10.15" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos-latest' && '10.15' || '' }}
          CXXFLAGS: ${{ matrix.platform == 'macos-latest' && '-mmacosx-version-min=10.15' || '' }}
          CFLAGS: ${{ matrix.platform == 'macos-latest' && '-mmacosx-version-min=10.15' || '' }}
          CC: ${{ matrix.platform == 'macos-latest' && 'clang' || '' }}
          CXX: ${{ matrix.platform == 'macos-latest' && 'clang++' || '' }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Localvox ${{ steps.version.outputs.tag }}'
          releaseDraft: true
          prerelease: false